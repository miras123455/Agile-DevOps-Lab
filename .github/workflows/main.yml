name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: echo "Build successful"

      - name: Test
        run: |
          test -f index.html
          echo "Test successful"

      - name: Deploy
        run: echo "Deploy successful"
